</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs><text x="24" y="34" class="t" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve">One core, four interfaces</text><text x="24" y="56" class="m" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Every operation is declared once in ops.py. The CLI, the API and the MCP tools are generated from it; the Studio is a client of the API.</text><rect x="24" y="84" width="278" height="74" rx="10" class="card" /><circle cx="44" cy="108" r="5" class="c1"/><text x="58" y="113" class="t" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">UI</text><text x="104" y="113" class="m" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Studio · people who click</text><text x="40" y="140" class="acc mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">creative-kit studio</text><rect x="24" y="170" width="278" height="74" rx="10" class="card" /><circle cx="44" cy="194" r="5" class="c3"/><text x="58" y="199" class="t" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">API</text><text x="104" y="199" class="m" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">other services</text><text x="40" y="226" class="acc mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">POST /api/&lt;operation&gt;</text><path d="M302 207.0 C 332 207.0 330 276.0 358 276.0" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="256" width="278" height="74" rx="10" class="card" /><circle cx="44" cy="280" r="5" class="c2"/><text x="58" y="285" class="t" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">CLI</text><text x="104" y="285" class="m" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">terminals, scripts, CI</text><text x="40" y="312" class="acc mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">creative-kit explain …</text><path d="M302 293.0 C 332 293.0 330 276.0 358 276.0" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="342" width="278" height="74" rx="10" class="card" /><circle cx="44" cy="366" r="5" class="c4"/><text x="58" y="371" class="t" font-size="15" font-weight="700" text-anchor="start" xml:space="preserve">MCP</text><text x="104" y="371" class="m" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">Claude and other agents</text><text x="40" y="398" class="acc mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">creative-kit mcp</text><path d="M302 379.0 C 332 379.0 330 276.0 358 276.0" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><path d="M272 158 L 272 169" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><text x="266" y="167" class="m" font-size="10.5" font-weight="400" text-anchor="end" xml:space="preserve">calls</text><rect x="360" y="84" width="236" height="384" rx="12" class="core" stroke-width="1.5"/><text x="378" y="114" class="acc mono" font-size="17" font-weight="700" text-anchor="start" xml:space="preserve">ops.py</text><text x="378" y="134" class="m" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">one registry · 14 operations</text><text x="378" y="166" class="m" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">READ</text><text x="378" y="188" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">help</text><text x="482" y="188" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">campaigns</text><text x="378" y="209" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">explain</text><text x="482" y="209" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">report</text><text x="378" y="230" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">deliverables</text><text x="482" y="230" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">who</text><text x="378" y="251" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">can</text><text x="482" y="251" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">get</text><text x="378" y="272" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">snapshot</text><text x="482" y="272" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">estimate</text><text x="378" y="293" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">costs</text><text x="482" y="293" class="t mono" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">forecast</text><text x="378" y="336" class="m" font-size="11" font-weight="700" text-anchor="start" xml:space="preserve">WRITE  ·  needs a person</text><text x="378" y="358" class="bad mono" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">set</text><text x="482" y="358" class="bad mono" font-size="13" font-weight="600" text-anchor="start" xml:space="preserve">run</text><text x="378" y="414" class="m" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">typed args + a docstring</text><text x="378" y="432" class="m" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">→ CLI flags, routes, tools, help</text><path d="M596 276.0 L 638 276.0" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="640" y="226.0" width="132" height="100" rx="10" class="card" /><text x="654" y="254.0" class="t mono" font-size="14" font-weight="700" text-anchor="start" xml:space="preserve">access.py</text><text x="654" y="276.0" class="m" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">who may?</text><text x="654" y="294.0" class="m mono" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">teams.yaml</text><text x="654" y="312.0" class="m" font-size="12" font-weight="400" text-anchor="start" xml:space="preserve">locks legal</text><path d="M772 276.0 C 792 276.0 786 151 804 151" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="806" y="118" width="130" height="66" rx="10" class="card" /><text x="818" y="145" class="t mono" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">config/*.yaml</text><text x="818" y="165" class="m" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">1-line diffs</text><path d="M772 276.0 C 792 276.0 786 247 804 247" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="806" y="214" width="130" height="66" rx="10" class="card" /><text x="818" y="241" class="t mono" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">engine</text><text x="818" y="261" class="m" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">source · render</text><path d="M772 276.0 C 792 276.0 786 343 804 343" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="806" y="310" width="130" height="66" rx="10" class="card" /><text x="818" y="337" class="t mono" font-size="13" font-weight="700" text-anchor="start" xml:space="preserve">audit + spend</text><text x="818" y="357" class="m" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">who, what, cost</text><rect x="24" y="482" width="912" height="30" rx="15" class="pill" /><text x="480" y="502" class="t" font-size="12.5" font-weight="400" text-anchor="middle" xml:space="preserve">Who is acting is never an argument:  --as  ·  X-Acting-As header  ·  PIPELINE_USER.  Nobody set = read-only.</text></svg>
