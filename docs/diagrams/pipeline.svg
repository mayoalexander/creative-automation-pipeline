</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs><text x="24" y="34" class="t" font-size="19" font-weight="700" text-anchor="start" xml:space="preserve">How a brief becomes ads</text><text x="24" y="56" class="m" font-size="13" font-weight="400" text-anchor="start" xml:space="preserve">Each config file has one owning team. The engine merges them per market, then runs four phases.</text><rect x="24" y="80" width="200" height="36" rx="8" class="card" /><rect x="24" y="80" width="200" height="36" rx="8" fill="none" class="s4" stroke-width="1.4"/><text x="38" y="103" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">org.yaml</text><text x="212" y="103" class="c4" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Ops</text><path d="M224 98 C 244 98 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="124" width="200" height="36" rx="8" class="card" /><rect x="24" y="124" width="200" height="36" rx="8" fill="none" class="s1" stroke-width="1.4"/><text x="38" y="147" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">brands/</text><text x="212" y="147" class="c1" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Brand</text><path d="M224 142 C 244 142 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="168" width="200" height="36" rx="8" class="card" /><rect x="24" y="168" width="200" height="36" rx="8" fill="none" class="s2" stroke-width="1.4"/><text x="38" y="191" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">markets/</text><text x="212" y="191" class="c2" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Regional</text><path d="M224 186 C 244 186 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="212" width="200" height="36" rx="8" class="card" /><rect x="24" y="212" width="200" height="36" rx="8" fill="none" class="s3" stroke-width="1.4"/><text x="38" y="235" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">partners/</text><text x="212" y="235" class="c3" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Partnerships</text><path d="M224 230 C 244 230 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="256" width="200" height="36" rx="8" class="card" /><rect x="24" y="256" width="200" height="36" rx="8" fill="none" class="s5" stroke-width="1.4"/><text x="38" y="279" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">channels/</text><text x="212" y="279" class="c5" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Channels</text><path d="M224 274 C 244 274 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="24" y="300" width="200" height="36" rx="8" class="card" /><rect x="24" y="300" width="200" height="36" rx="8" fill="none" class="s1" stroke-width="1.4"/><text x="38" y="323" class="t mono" font-size="12.5" font-weight="600" text-anchor="start" xml:space="preserve">campaigns/</text><text x="212" y="323" class="c1" font-size="11.5" font-weight="600" text-anchor="end" xml:space="preserve">Campaign</text><path d="M224 318 C 244 318 244 206 258 206" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="150" width="158" height="120" rx="10" class="core" stroke-width="1.3"/><text x="274" y="176" class="acc" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">1 · RESOLVE</text><text x="274" y="194" class="m" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve">per market</text><text x="274" y="220" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">brand ► sub-brand ►</text><text x="274" y="237" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">market ► partner</text><text x="274" y="254" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">localize · legal check</text><path d="M418 210 L 428 210" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="430" y="150" width="158" height="120" rx="10" class="card" stroke-width="1.3"/><text x="444" y="176" class="acc" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">2 · SOURCE</text><text x="444" y="194" class="m" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve">per market × product</text><text x="444" y="220" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">market asset ►</text><text x="444" y="237" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">global ► cache ►</text><text x="444" y="254" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">GENERATE (GenAI)</text><path d="M588 210 L 598 210" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="600" y="150" width="158" height="120" rx="10" class="card" stroke-width="1.3"/><text x="614" y="176" class="acc" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">3 · RENDER</text><text x="614" y="194" class="m" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve">× channel × format × type</text><text x="614" y="220" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">static → compose</text><text x="614" y="237" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">+ brand check on pixels</text><text x="614" y="254" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">others → planned</text><path d="M758 210 L 768 210" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="770" y="150" width="158" height="120" rx="10" class="card" stroke-width="1.3"/><text x="784" y="176" class="acc" font-size="13.5" font-weight="700" text-anchor="start" xml:space="preserve">4 · REPORT</text><text x="784" y="194" class="m" font-size="11" font-weight="400" text-anchor="start" xml:space="preserve">files + approvals</text><text x="784" y="220" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">report.json · plan.json</text><text x="784" y="237" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">approvals per market</text><text x="784" y="254" class="t" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">cost and time saved</text><path d="M320 270 L 320 300" class="ln" stroke-width="1.6" marker-end="url(#ah)"/><rect x="260" y="302" width="262" height="34" rx="8" class="card" /><text x="272" y="324" class="bad" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">legal fails → that market ships nothing</text><text x="614" y="300" class="m" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">96 ads for Spring Launch: 4 markets × 2 products</text><text x="614" y="318" class="m" font-size="11.5" font-weight="400" text-anchor="start" xml:space="preserve">× 4 creative types × 3 ratios · 96/96 brand checks</text></svg>
