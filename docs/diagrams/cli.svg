</style><defs><marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path class="ah" d="M0 0 10 5 0 10z"/></marker></defs><style>.term{fill:#0d1117}.bar{fill:#161b22}.tp{fill:#5eead4}.to{fill:#c9d1d9}.te{fill:#f87171}.tk{fill:#7ee787}.tc{fill:#e6edf3}.tm{fill:#8b949e}</style><rect x="0" y="0" width="960" height="441" rx="12" class="term"/><path d="M0 12a12 12 0 0 1 12-12h936a12 12 0 0 1 12 12v22H0z" class="bar"/><circle cx="20" cy="17" r="5.5" fill="#ff5f57"/><circle cx="38" cy="17" r="5.5" fill="#febc2e"/><circle cx="56" cy="17" r="5.5" fill="#28c840"/><text x="480.0" y="22" class="tm" font-size="12" font-weight="400" text-anchor="middle" xml:space="preserve">creative-kit · the CLI (real output)</text><text x="22" y="58" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tp">$ </tspan><tspan class="tc">creative-kit campaigns</tspan></text><text x="22" y="77" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">ID             NAME           BRAND       PARTNER  MARKETS         PRODUCTS            CREATIVE_TYPES</text><text x="22" y="96" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">spring-launch  Spring Launch  acme-fresh  sportco  us, mx, jp, de  shampoo, lotion     product, influencer, ugc, poster</text><text x="22" y="115" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">summer-promo   Summer Promo   acme                 us, mx          shampoo, sunscreen  product, poster</text><text x="22" y="153" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tp">$ </tspan><tspan class="tc">creative-kit who markets/jp.yaml overrides.acme.legal</tspan></text><text x="22" y="172" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">who may update markets/jp.yaml#overrides.acme.legal (locked section)</text><text x="22" y="191" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">  legal           lee@example.com</text><text x="22" y="229" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tp">$ </tspan><tspan class="tc">creative-kit set markets/jp.yaml overrides.acme.legal.banned_words "[治る]" --as yuki@example.com</tspan></text><text x="22" y="248" class="te mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">refused: yuki@example.com may not update markets/jp.yaml#overrides.acme.legal.banned_words (ask: legal)</text><text x="22" y="286" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tp">$ </tspan><tspan class="tc">creative-kit set markets/jp.yaml overrides.acme.marketing.cta 今すぐチェック --as yuki@example.com</tspan></text><text x="22" y="305" class="tk mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve">updated markets/jp.yaml: overrides.acme.marketing.cta  (as yuki@example.com, audited)</text><text x="22" y="343" class="mono" font-size="12.5" xml:space="preserve"><tspan class="tp">$ </tspan><tspan class="tc">creative-kit run spring-launch --provider mock --markets jp</tspan></text><text x="22" y="362" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"> market locale   built  planned  blocked  reuse/gen  brand ✓  message</text><text x="22" y="381" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"> jp     ja-JP       24       48        0        1/5    24/24  一日中、さわやかに</text><text x="22" y="400" class="to mono" font-size="12.5" font-weight="400" text-anchor="start" xml:space="preserve"> built 24  ·  planned 48  ·  blocked 0  ·  errors 0  ·  GenAI cost $0.0</text></svg>
