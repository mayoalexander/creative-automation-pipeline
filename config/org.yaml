# Operating config: the client's discovery answers, captured as input parameters.
# Same engine, different org.yaml => different client.
org: acme-global

regions:
  na: [us]
  latam: [mx]
  apac: [jp]
  emea: [de]

velocity:
  campaigns_per_month:
    current: 80
    target: 300

creative_resources:
  in_house: {designers: 6, hours_per_week: 240}
  agencies:
    - {name: AgencyX, markets: [mx, us]}
  # Baseline used for the "time saved" metric: how long one creative takes by hand.
  manual_minutes_per_creative: 45
  genai:
    image_provider: openrouter      # openrouter | openai | mock
    openrouter_image_model: google/gemini-2.5-flash-image   # any OpenRouter image model
    openrouter_text_model: google/gemini-2.5-flash          # translation
    openrouter_fallback_models: [black-forest-labs/flux.2-pro]   # tried when a model refuses or fails
    image_model: gpt-image-1        # used by the openai provider
    image_cost_usd: 0.04            # per generated image, for the cost estimate
    text_model: gpt-4o-mini         # translation, openai provider
    budget_per_month_usd: 500

# Approvers are TEAM ids from teams.yaml, so "who signs off" and "who may edit" share one list.
# `python -m engines.vanilla access who ...` turns a team into the people on it.
approvers:
  global: [brand]
  default: [ops]
  by_market:
    us: [regional-na]
    mx: [regional-latam]
    jp: [regional-apac, legal]
    de: [regional-emea]
