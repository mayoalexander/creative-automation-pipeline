[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "creative-automation-pipeline"
version = "0.1.0"
description = "One campaign brief to localized, on-brand ad creatives, through a UI, CLI, API and MCP."
requires-python = ">=3.10"
dynamic = ["dependencies"]

[project.scripts]
creative = "engines.vanilla.cli:main"     # the CLI; same as python -m engines.vanilla

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.packages.find]
include = ["engines*"]
